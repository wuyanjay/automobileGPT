{
  "seed": 42,
  "paths": {
    "raw": "data/raw",
    "work": "data/work/smoke_verify",
    "final": "data/final/smoke_verify"
  },
  "sources": {
    "amck": "data/raw/amck/amck.json",
    "d2": "data/raw/mechanics_exchange/mechanics_english_sft.jsonl",
